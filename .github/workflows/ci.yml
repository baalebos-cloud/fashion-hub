name: Engineering checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fashionhub
          POSTGRES_PASSWORD: fashionhub
          POSTGRES_DB: fashionhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fashionhub"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://fashionhub:fashionhub@localhost:5432/fashionhub_test
      TEST_DATABASE_URL: postgresql+psycopg://fashionhub:fashionhub@localhost:5432/fashionhub_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-key-never-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app
      - name: Verify application imports
        run: python -c 'from app.main import app; assert app.routes'
      - name: Security foundation tests
        run: python -m unittest discover -s tests/foundation -v
      - name: Service and API regression tests
        run: pytest tests --cov=app --cov-report=term-missing
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
        if: ${{ !cancelled() }}
      - run: npm run build
        if: ${{ !cancelled() }}
