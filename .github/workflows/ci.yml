name: Engineering checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fashionhub
          POSTGRES_PASSWORD: fashionhub
          POSTGRES_DB: fashionhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fashionhub"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://fashionhub:fashionhub@localhost:5432/fashionhub_test
      TEST_DATABASE_URL: postgresql+psycopg://fashionhub:fashionhub@localhost:5432/fashionhub_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-key-never-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install --require-hashes -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app
      - name: Verify application imports
        run: python -c 'from app.main import app; assert app.routes'
      - name: Security foundation tests
        run: python -m unittest discover -s tests/foundation -v
      - name: Service and API regression tests
        run: pytest tests --cov=app --cov-report=term-missing
  frontend:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
        if: ${{ !cancelled() }}
      - run: npm run build
        if: ${{ !cancelled() }}
      - name: Install browser for theme regression checks
        run: npx playwright install --with-deps chromium
      - name: Verify production styling in a browser
        run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure
          path: frontend/test-results
          retention-days: 7
  container:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image with locked dependencies
        run: docker build --tag fashion-hub:ci backend
      - name: Verify non-root container startup and liveness
        run: |
          docker run --detach --name fashion-hub-ci --publish 127.0.0.1:8005:8005 fashion-hub:ci
          test "$(docker exec fashion-hub-ci id -u)" = "10001"
          timeout 45 bash -c 'until curl --fail --silent http://127.0.0.1:8005/health/live; do sleep 1; done'
      - name: Container logs
        if: failure()
        run: docker logs fashion-hub-ci
      - name: Stop test container
        if: always()
        run: docker rm --force fashion-hub-ci || true
