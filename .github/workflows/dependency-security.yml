name: Dependency security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the reviewed frontend lockfile
        run: npm ci --ignore-scripts
      - name: Audit runtime and development dependencies
        run: npm audit
  backend-audit:
    env:
      CUSTOM_COMPILE_COMMAND: python -m piptools compile --generate-hashes --output-file=requirements.txt requirements.in
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install pip-audit==2.10.1 pip-tools==7.6.2
      - name: Verify the compiled lock matches its source
        run: |
          pip-compile --quiet --generate-hashes --no-emit-index-url --no-emit-trusted-host --output-file=requirements.txt requirements.in
          git diff --exit-code -- requirements.txt
      - name: Audit the complete locked backend environment
        run: pip-audit --strict --require-hashes -r requirements.txt --progress-spinner=off
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install detect-secrets==1.5.0
      - name: Scan tracked source files for potential credentials
        run: |
          detect-secrets scan --all-files \
            --exclude-files '(^\.git/|^backend/tests/|^frontend/tests/|^docker-compose\.test\.yml$|(^|/)(package-lock\.json|requirements\.txt|\.env\.example)$)' > /tmp/seam-secret-scan.json
          python - <<'PY'
          import json
          from pathlib import Path
          results = json.loads(Path('/tmp/seam-secret-scan.json').read_text()).get('results', {})
          # Explicitly reviewed synthetic fixtures, documentation examples,
          # migration revision IDs, and configuration *checks*. Keep this
          # allowlist exact: new candidates or moved credentials fail CI.
          allowed = {
              ('.github/workflows/ci.yml', 'Secret Keyword', 23),
              ('.github/workflows/ci.yml', 'Basic Auth Credentials', 37),
              ('.github/workflows/ci.yml', 'Secret Keyword', 40),
              ('.github/workflows/ci.yml', 'Basic Auth Credentials', 106),
              ('backend/.github/workflows/ci.yml', 'Secret Keyword', 17),
              ('backend/.github/workflows/ci.yml', 'Basic Auth Credentials', 35),
              ('backend/.github/workflows/ci.yml', 'Secret Keyword', 37),
              ('backend/alembic.ini', 'Basic Auth Credentials', 4),
              ('backend/app/core/config.py', 'Basic Auth Credentials', 32),
              ('backend/app/core/config.py', 'Secret Keyword', 174),
              ('backend/deployment/railway.md', 'Basic Auth Credentials', 47),
              ('backend/docker-compose.yml', 'Secret Keyword', 9),
              ('backend/docker-compose.yml', 'Basic Auth Credentials', 40),
              ('backend/migrations/versions/0002_referrals_payouts_nin_whatsapp.py', 'Hex High Entropy String', 19),
              ('backend/migrations/versions/0003_payment_recovery_outbox.py', 'Hex High Entropy String', 11),
              ('backend/migrations/versions/035e1bd61029_create_initial_tables.py', 'Hex High Entropy String', 15),
              ('backend/migrations/versions/2ab23f38e9c6_merge_conflicting_database_branches.py', 'Hex High Entropy String', 14),
              ('backend/scripts/create_test_users.py', 'Secret Keyword', 19),
          }
          found = {
              (path, item['type'], item['line_number'])
              for path, findings in results.items()
              for item in findings
          }
          unexpected = sorted(found - allowed)
          if unexpected:
              print('Unreviewed secret candidates (file, detector, line):')
              for candidate in unexpected:
                  print(*candidate)
              raise SystemExit(1)
          print('No unreviewed secrets detected. Reviewed fixture candidates:', len(found))
          PY
