name: Dependency security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Inspect baseline and generate candidate lockfile
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-before.json" || true
          npm audit fix --package-lock-only --ignore-scripts || true
          npm audit --json > "$RUNNER_TEMP/npm-after.json" || true
          python - <<'PY'
          import base64, json, os, pathlib, zlib
          for phase in ['before', 'after']:
              report = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'npm-' + phase + '.json').read_text())
              print('NPM_AUDIT_' + phase.upper(), json.dumps(report))
          files = {name: pathlib.Path(name).read_text() for name in ['package.json', 'package-lock.json']}
          print('CANDIDATE_FRONTEND_ZLIB_BASE64=' + base64.b64encode(zlib.compress(json.dumps(files).encode())).decode())
          PY
      - name: Baseline must be remediated before review
        run: npm audit
  backend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt pip-audit==2.10.1 pip-tools==7.6.2
      - name: Resolve a reproducible backend environment
        run: |
          CUSTOM_COMPILE_COMMAND="python -m piptools compile --generate-hashes --output-file=requirements.lock requirements.txt" pip-compile --quiet --generate-hashes --no-emit-index-url --no-emit-trusted-host --output-file=requirements.lock requirements.txt
          pip-audit --require-hashes -r requirements.lock --format=json --output="$RUNNER_TEMP/backend-audit.json" --progress-spinner=off || true
          python - <<'PYTHON'
          import base64, json, os, pathlib, zlib
          report = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'backend-audit.json').read_text())
          for dependency in report['dependencies']:
              if dependency.get('vulns'):
                  print('PYTHON_AUDIT', json.dumps(dependency))
          files = {'requirements.lock': pathlib.Path('requirements.lock').read_text()}
          print('CANDIDATE_BACKEND_ZLIB_BASE64=' + base64.b64encode(zlib.compress(json.dumps(files).encode())).decode())
          PYTHON
      - name: Dependencies must be remediated before review
        run: pip-audit --require-hashes -r requirements.lock --progress-spinner=off
