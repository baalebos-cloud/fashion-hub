name: Feature dependency lock bootstrap
on:
  push:
    branches:
      - feature/saga-payments-and-frontend-measurements
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm --prefix frontend install --package-lock-only --ignore-scripts --no-audit
      - run: |
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(security): lock patched Zod'
            git push origin HEAD:feature/saga-payments-and-frontend-measurements
          fi
