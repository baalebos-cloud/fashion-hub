name: Resolve reviewed dependency locks
on:
  pull_request:
permissions:
  contents: read
jobs:
  frontend-lock:
    if: github.event.number == 12 || github.event.number == 14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --package-lock-only --ignore-scripts --no-fund
        working-directory: frontend
      - name: Export generated lock for review
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          encoded = base64.b64encode(gzip.compress(Path('frontend/package-lock.json').read_bytes())).decode()
          print('REVIEW_LOCK_BEGIN')
          for offset in range(0, len(encoded), 1000):
              print('REVIEW_LOCK_CHUNK:' + encoded[offset:offset+1000])
          print('REVIEW_LOCK_END')
          PY
  backend-lock:
    if: github.event.number == 16
    runs-on: ubuntu-latest
    env:
      CUSTOM_COMPILE_COMMAND: python -m piptools compile --generate-hashes --output-file=requirements.txt requirements.in
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-tools==7.6.2
      - run: pip-compile --quiet --generate-hashes --no-emit-index-url --no-emit-trusted-host --output-file=requirements.txt requirements.in
        working-directory: backend
      - name: Export generated lock for review
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          encoded = base64.b64encode(gzip.compress(Path('backend/requirements.txt').read_bytes())).decode()
          print('REVIEW_LOCK_BEGIN')
          for offset in range(0, len(encoded), 1000):
              print('REVIEW_LOCK_CHUNK:' + encoded[offset:offset+1000])
          print('REVIEW_LOCK_END')
          PY
