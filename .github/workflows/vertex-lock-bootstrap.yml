name: Vertex dependency hash lock bootstrap
on:
  push:
    branches: [feature/vertex-multimodal-safe-20261028]
permissions:
  contents: write
jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pip-tools==7.6.2
      - name: Refresh hash-pinned dependencies
        working-directory: backend
        run: python -m piptools compile --generate-hashes --output-file=requirements.txt requirements.in
      - name: Commit generated lockfile
        run: |
          git add backend/requirements.txt
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(ai): regenerate hash-pinned Vertex dependencies'
            git push origin HEAD:feature/vertex-multimodal-safe-20261028
          fi
