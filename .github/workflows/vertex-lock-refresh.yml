name: One-time Vertex hash lock regeneration
on:
  push:
    branches: [feature/vertex-multimodal-safe-20261028]
concurrency:
  group: vertex-lock-refresh
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pip-tools==7.6.2
      - name: Refresh fully hash-pinned dependency lock
        working-directory: backend
        run: pip-compile --quiet --generate-hashes --no-emit-index-url --no-emit-trusted-host --output-file=requirements.txt requirements.in
      - name: Commit regenerated lockfile
        run: |
          git add backend/requirements.txt
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(ai): regenerate patched Vertex dependency hashes'
            git pull --rebase origin feature/vertex-multimodal-safe-20261028
            git push origin HEAD:feature/vertex-multimodal-safe-20261028
          fi
