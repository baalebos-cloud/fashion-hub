name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fashionhub
          POSTGRES_PASSWORD: fashionhub
          POSTGRES_DB: fashionhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fashionhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://fashionhub:fashionhub@localhost:5432/fashionhub_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Lint
        run: |
          ruff check app tests
          mypy app || true  # non-blocking until full type coverage lands

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing
