# Reverse proxy for the FastAPI app. Terminate TLS here (or upstream at a
# provider load balancer) in production -- this scaffold ships HTTP-only
# for local/dev; add a `listen 443 ssl;` server block with real certs
# (e.g. via certbot) before exposing this publicly.

upstream fashion_hub_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    location /health {
        proxy_pass http://fashion_hub_api;
        access_log off;
    }

    location / {
        proxy_pass http://fashion_hub_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Payment/delivery webhooks: no auth at this layer -- trust is
    # established via provider signature verification inside the app.
    location ~ ^/api/v1/(payments/webhooks|delivery-webhooks)/ {
        proxy_pass http://fashion_hub_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
