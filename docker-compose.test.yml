# Isolated disposable testing infrastructure. Never set production DATABASE_URL here.
# Run: docker compose -f docker-compose.test.yml up -d --wait
# Stop: docker compose -f docker-compose.test.yml down -v
name: fashion-hub-test
services:
  postgis-test:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: fashionhub_test
      POSTGRES_USER: fashionhub
      POSTGRES_PASSWORD: fashionhub-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashionhub -d fashionhub_test"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
  redis-test:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:56379:6379"
    tmpfs:
      - /data
