version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      # Baked in at build time by Vite; runtime env vars have no effect on
      # a static build. Rebuild the image to change these in production.
      VITE_API_BASE_URL: /api/v1
