# Serves the compiled single-page app and reverse-proxies /api to the
# FastAPI backend, so the browser only ever talks to one origin.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: any unmatched path falls back to index.html so
    # React Router (not Nginx) resolves the route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
